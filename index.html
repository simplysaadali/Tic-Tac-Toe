<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== START PAGE ===== -->
    <div class="start-page" id="startPage">
        <div class="start-card">
            <h1>TIC TAC TOE</h1>
            <span class="title-rule"></span>
            <div class="subtitle">Ready to play?</div>
            <div class="mode-group">
                <button class="mode-btn" id="modeBot">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="8" width="18" height="12" rx="2"/>
                        <path d="M8 4v2M16 4v2"/>
                        <circle cx="9" cy="13" r="1.5"/>
                        <circle cx="15" cy="13" r="1.5"/>
                        <path d="M12 16v1"/>
                        <line x1="12" y1="4" x2="12" y2="2"/>
                    </svg>
                    Play vs Bot
                </button>
            </div>
            <div class="start-footer">
                <span class="start-footer-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" stroke="#f5b45a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    You
                </span>
                <span class="start-footer-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" stroke="#7fc9f5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                    </svg>
                    Opponent
                </span>
            </div>
        </div>
    </div>

    <!-- ===== WIN OVERLAY ===== -->
    <div class="win-overlay" id="winOverlay">
        <div class="win-card">
            <div id="winMsg"></div>
            <div class="win-sub">Game over</div>
            <button class="new-game-btn" id="winNewBtn">
                <svg class="icon-btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-3-6.7"/>
                    <polyline points="21 3 21 9 15 9"/>
                </svg>
                New Game
            </button>
        </div>
    </div>

    <!-- ===== MAIN GAME ===== -->
    <main>
        <div class="game-wrapper">
            <div class="game-title">TIC TAC TOE</div>
            <span class="title-rule" style="margin-bottom: 0.9rem;"></span>

            <div class="status-bar">
                <div class="turn-indicator" id="turnIndicator">
                    <svg viewBox="0 0 24 24" id="turnSvg">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    <span class="turn-label" id="turnDisplay"></span>
                </div>
                <div class="score-display">
                    <span class="score-item score-x">
                        <svg viewBox="0 0 24 24">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                        <span class="score-val" id="scoreX">0</span>
                    </span>
                    <span class="score-item score-o">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"/>
                        </svg>
                        <span class="score-val" id="scoreO">0</span>
                    </span>
                </div>
            </div>

            <div class="board-stage">
                <div class="game-board" id="board"></div>
                <svg class="win-line-svg" id="winLineSvg" viewBox="0 0 3 3"></svg>
            </div>

            <button class="action-btn" id="resetBtn">
                <svg class="icon-btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-3-6.7"/>
                    <polyline points="21 3 21 9 15 9"/>
                </svg>
                Reset Game
            </button>

            <div class="history-panel">
                <div class="history-head">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <polyline points="12 7 12 12 15.5 14"/>
                    </svg>
                    Match History
                </div>
                <ul class="history-list" id="historyList"></ul>
                <p class="history-empty" id="historyEmpty">No games finished yet — play one out.</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
